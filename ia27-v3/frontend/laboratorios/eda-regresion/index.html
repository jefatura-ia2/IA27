function sd(a){a=clean(a);if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));}

function flagOutliers(rows){
  const info={};
  NUM.forEach(c=>{const t=tukey(rows.map(r=>r[c]));info[c]=t;rows.forEach(r=>{if(isNum(r[c])&&(r[c]<t.lo||r[c]>t.hi))r._out[c]=true;});});
  return info;
}
function rawView(){
  const rows=RAW.map(r=>Object.assign({},r,{_imp:{},_out:{},_win:{}}));
  const outInfo=flagOutliers(rows);
  return {rows,outInfo,impInfo:{},kind:'raw'};
}
function buildWork(){
  let rows=RAW.map(r=>Object.assign({},r,{_imp:{},_out:{},_win:{}}));
  const impInfo={};
  if(S.imp==='drop'){
    rows=rows.filter(r=>NUM.every(c=>isNum(r[c])));
  }else if(S.imp!=='none'){
    NUM.forEach(c=>{
      const col=RAW.map(r=>r[c]);
      let method=S.imp;
      if(S.imp==='theory')method=(c==='periodo_s'||c==='longitud_m')?'theory':'median';
      const v=method==='mean'?mean(col):median(col);
      impInfo[c]={method,value:v};
      rows.forEach(r=>{
        if(isNum(r[c]))return;
        let nv=v;
        if(method==='theory'){
          if(c==='periodo_s'&&isNum(r.longitud_m))nv=2*Math.PI*Math.sqrt(r.longitud_m/G);
          else if(c==='longitud_m'&&isNum(r.periodo_s))nv=G*(r.periodo_s/(2*Math.PI))**2;
          else nv=median(col);
        }
        r[c]=round(nv,META[c].dec);r._imp[c]=method;
      });
    });
  }
  const outInfo=flagOutliers(rows);
  if(S.outAct==='drop')rows=rows.filter(r=>!Object.keys(r._out).length);
  else if(S.outAct==='winsor')rows.forEach(r=>Object.keys(r._out).forEach(c=>{const t=outInfo[c];r._win[c]=r[c];r[c]=round(Math.min(Math.max(r[c],t.lo),t.hi),META[c].dec);}));
  return {rows,outInfo,impInfo,kind:'work'};
}

  const out={keep:'anomalías mantenidas',drop:'filas con anomalías eliminadas',winsor:'anomalías recortadas a la valla de Tukey (winsorización)'}[S.outAct];

}

function ticks(min,max,n){

  const raw=(max-min)/(n||5),mag=10**Math.floor(Math.log10(raw)),e=raw/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const t=[];

  if(!o.noY)ticks(o.yd[0],o.yd[1],5).forEach(t=>{if(t<o.yd[0]||t>o.yd[1])return;g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${fmt(t,4)}</text>`;});

  g+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  if(!o.noY)g+=`<line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H-m.b}"/>`;

}
